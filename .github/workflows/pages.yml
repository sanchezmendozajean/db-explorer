# Publica site/ (la portada) y la documentación de usuario generada desde site-docs/ en GitHub Pages
# en cada push a main que los toque.
# Configuración única: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'site-docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-docs/package-lock.json
      # VitePress escribe la documentación en site/docs, junto a la portada.
      - run: npm ci
        working-directory: site-docs
      - run: npm run build
        working-directory: site-docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
