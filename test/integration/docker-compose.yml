# Motores para las pruebas de integración de drivers.
# Uso:  docker compose -f test/integration/docker-compose.yml --env-file test/integration/.env up -d
# Copia .env.example a .env y ajusta si lo necesitas (nunca subas .env al repositorio).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-dbx}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dbx_test_pw}
      POSTGRES_DB: ${PG_DATABASE:-dbx_test}
    ports:
      - '${PG_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-dbx}']
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: ${MARIADB_USER:-dbx}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dbx_test_pw}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dbx_root_pw}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-dbx_test}
    ports:
      - '${MARIADB_PORT:-53306}:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dbx_Test_Pw1!}
      MSSQL_PID: Developer
    ports:
      - '${MSSQL_PORT:-51433}:1433'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
